[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dany-super-agent"
version = "0.1.0"
description = "Privacy-first local VMware/Broadcom support assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "streamlit>=1.38,<2",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
include = ["dany_super_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

